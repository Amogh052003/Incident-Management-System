name: Generate Documentation

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  pull_request:
    branches:
      - main

jobs:
  generate-docs:
    name: Generate API and Code Documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Generate OpenAPI specification
      - name: Generate OpenAPI specification
        run: npm run docs:openapi

      # 5. Generate JavaScript documentation
      - name: Generate JSDoc documentation
        run: npm run docs:jsdoc

      # 6. Show generated documentation
      - name: Show generated documentation
        run: |
          echo "Generated documentation:"
          find docs -type f
          
      # 7. Commit generated documentation
      - name: Commit generated documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No documentation changes."
          else
            git commit -m "docs: regenerate documentation"
            git push
          fi